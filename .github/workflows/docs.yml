name: Docs

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Sphinx docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for board checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check read-only board behavior
        run: node --test tests/frontend/*.test.cjs

      - name: Build docs with warnings as errors
        run: ./scripts/check-docs.sh

      - name: Check every rendered paper citation in Chromium
        env:
          PYTHON_BIN: /tmp/woeai-docs-venv/bin/python
        run: |
          npm ci --prefix tests/browser --ignore-scripts
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
          node --test tests/browser/citation-check.test.cjs
          node tests/browser/check-paper-citations.cjs /tmp/woeai-sphinx-html
